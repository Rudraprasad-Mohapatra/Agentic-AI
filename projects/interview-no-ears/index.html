<!doctype html>
<html><head><meta charset="utf-8"><title>Tall Tale 3D - Eiffel Con</title>
<style>
@font-face { font-family: 'Inter'; font-weight: 900; src: url('fonts/Inter-Black.otf'); }
@font-face { font-family: 'Inter'; font-weight: 800; src: url('fonts/Inter-ExtraBold.otf'); }
@font-face { font-family: 'Caladea'; font-weight: 700; src: url('fonts/Caladea-Bold.ttf'); }
html, body { margin: 0; background: #070912; height: 100%; overflow: hidden; }
body { display: flex; align-items: center; justify-content: center; }
#cv { display: block; max-height: 100vh; max-width: 100vw; width: auto; height: auto; object-fit: contain; }
body.capture #cv { max-height: none; max-width: none; }
#gl { display: none; }
#play { position: fixed; font: 900 28px Inter, sans-serif; padding: 18px 36px; border: 0; border-radius: 40px; background: #FFD43B; cursor: pointer; z-index: 100; }
</style></head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas><canvas id="gl" width="1080" height="1920"></canvas>
<button id="play" hidden>▶ PLAY</button>
<script>
if (location.search.includes('capture')) document.body.className = 'capture';
const Q = new URLSearchParams(location.search);
const is16x9 = Q.has('16x9') || Q.get('ar') === '16:9' || Q.get('format') === '16:9';
const cv = document.getElementById('cv'), gl = document.getElementById('gl');
if (is16x9) {
  cv.width = 1920; cv.height = 1080;
  gl.width = 1920; gl.height = 1080;
} else {
  cv.width = 1080; cv.height = 1920;
  gl.width = 1080; gl.height = 1920;
}
</script>

<script type="module" src="src/main.js"></script>
</body></html>
